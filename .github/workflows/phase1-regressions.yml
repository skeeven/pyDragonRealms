name: Phase 1 regressions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev,ui]'
      - name: Run automated tests
        run: python -m pytest -q
      - name: Audit cards and short balance sample
        run: |
          python -m dragon_realms.balance --games 10 --seed 120
